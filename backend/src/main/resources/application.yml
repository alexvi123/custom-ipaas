spring:
  application:
    name: custom-ipaas
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ipaas}
    username: ${DB_USERNAME:ipaas}
    password: ${DB_PASSWORD:ipaas}
    hikari:
      connection-timeout: 3000
  mvc:
    problemdetails:
      enabled: true

ipaas:
  credentials:
    telegram:
      bot-token: ${TELEGRAM_BOT_TOKEN:}
  connectors:
    telegram:
      base-url: https://api.telegram.org
    http:
      allow-private-networks: false
